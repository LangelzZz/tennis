<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LANGEL vs PANABERTH · Marcador</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="tennis_ball.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#0c0e0d;
    --line:#242826;
    --ball:#d6ec33;
    --ball-dim:#7a8a23;
    --text:#f3f4f0;
    --dim:#8b928d;
    --win:#3fae63;
    --serve-glow: 0 0 0 2px rgba(214,236,51,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-x:hidden;
  }
  .num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;}

  /* ---------- SETUP SCREEN ---------- */
  #setup{
    width:100%;
    max-width:420px;
    text-align:center;
  }
  .brand{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.4px;
    color:var(--dim);
    margin-bottom:6px;
  }
  .matchup{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:clamp(30px,8vw,42px);
    line-height:1.05;
    margin:0 0 34px;
  }
  .matchup span:first-child{color:var(--text);}
  .matchup .vs{color:var(--ball);font-size:.55em;display:inline-block;margin:0 8px;vertical-align:2px;}
  .matchup span:last-child{color:var(--text);}

  .field-label{
    text-align:left;
    font-size:13px;
    color:var(--dim);
    margin:0 0 10px 4px;
  }
  .choice-row{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }
  .choice{
    flex:1;
    padding:16px 8px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:3px;}
  .choice.active{border-color:var(--ball);background:#12140f;box-shadow:var(--serve-glow);}

  .start-btn{
    width:100%;
    padding:18px;
    border-radius:14px;
    border:none;
    background:var(--ball);
    color:#0a0c05;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.3px;
    cursor:pointer;
  }
  .start-btn:active{transform:scale(.98);}
  .setup-note{margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.5;}

  /* ---------- MATCH SCREEN ---------- */
  #match{width:100%;max-width:480px;display:none;flex-direction:column;gap:14px;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px;
  }
  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#161a15;
    border:1px solid var(--line);
    color:var(--ball);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.5px;
    padding:5px 12px;
    border-radius:100px;
  }
  .status-pill.final{color:var(--win);}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ball);}
  .status-pill.final .dot{background:var(--win);}
  .timer{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--dim);
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .history-link{
    background:none;
    border:1px solid var(--line);
    color:var(--dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:5px 10px;
    border-radius:100px;
    cursor:pointer;
  }
  .history-link:active{background:#14170f;}

  .board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
  }
  .board-header{
    display:flex;
    padding:8px 16px;
    font-size:11px;
    color:var(--dim);
    border-bottom:1px solid var(--line);
  }
  .board-header .name-col{flex:1;}
  .board-header .set-col,
  .board-header .game-col{width:34px;text-align:center;font-size:11px;color:var(--dim);font-weight:500;border-left:1px solid var(--line);}
  .board-header .game-col{width:64px;}
  .set-col{width:34px;text-align:center;}
  .game-col{width:64px;text-align:center;}

  .row{
    width:100%;
    display:flex;
    align-items:center;
    padding:14px 16px;
    background:transparent;
    border:none;
    color:var(--text);
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    position:relative;
  }
  .row:not(:last-child){border-bottom:1px solid var(--line);}
  .row:active{background:#14170f;}
  .row.leading{background:linear-gradient(90deg, rgba(214,236,51,.07), transparent 60%);}

  .serve-dot{
    width:20px;
    height:20px;
    margin-right:10px;
    flex-shrink:0;
    opacity:0;
    transition:opacity .2s ease;
  }
  .serve-dot.on{opacity:1;}
  .serve-dot img{width:100%;height:100%;display:block;}

  .name-col{
    flex:1;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .set-col{
    width:34px;
    text-align:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:20px;
    font-weight:600;
    color:var(--dim);
    border-left:1px solid var(--line);
    align-self:stretch;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .set-col.current{color:var(--text);}
  .game-col{
    width:64px;
    text-align:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--ball);
    border-left:1px solid var(--line);
    align-self:stretch;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .game-col .pill{
    background:rgba(214,236,51,.14);
    border:1px solid rgba(214,236,51,.4);
    border-radius:10px;
    padding:3px 14px;
    min-width:38px;
    display:inline-block;
  }
  .sets-wrap{
    display:flex;
    align-self:stretch;
    align-items:center;
  }

  .controls{
    display:flex;
    gap:10px;
    justify-content:space-between;
  }
  .ghost-btn{
    flex:1;
    padding:12px 8px;
    border-radius:12px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .ghost-btn:active{background:#12140f;}
  .hint{
    text-align:center;
    font-size:12px;
    color:var(--dim);
    margin-top:2px;
  }

  /* ---------- END OVERLAY ---------- */
  #endOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:50;
  }
  .end-card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    text-align:center;
  }
  .trophy-line{font-size:13px;color:var(--dim);margin-bottom:6px;}
  .winner-name{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:clamp(28px,8vw,36px);
    color:var(--win);
    margin:0 0 14px;
  }
  .final-score{
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px;
    letter-spacing:.5px;
    color:var(--text);
    margin-bottom:6px;
  }
  .final-meta{font-size:12.5px;color:var(--dim);margin-bottom:22px;line-height:1.6;}
  .end-actions{display:flex;flex-direction:column;gap:10px;}
  .end-actions .start-btn{font-size:17px;padding:15px;}
  .end-actions .ghost-btn{padding:13px;}

  /* ---------- HISTORY OVERLAY ---------- */
  #historyOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:60;
  }
  .history-card{
    width:100%;
    max-width:440px;
    max-height:82vh;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    display:flex;
    flex-direction:column;
  }
  .history-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:19px;
    margin-bottom:14px;
  }
  .close-btn{
    background:none;
    border:none;
    color:var(--dim);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:4px 8px;
  }
  #historyList{
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .history-empty{
    color:var(--dim);
    font-size:13.5px;
    text-align:center;
    padding:30px 10px;
  }
  .history-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .history-item-main{flex:1;min-width:0;}
  .history-winner{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--win);
  }
  .history-score{
    font-size:14px;
    color:var(--text);
    margin-top:2px;
  }
  .history-date{
    font-size:11.5px;
    color:var(--dim);
    margin-top:3px;
  }
  .pdf-btn{
    flex-shrink:0;
    background:var(--ball);
    color:#0a0c05;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
  }
  .pdf-btn:active{transform:scale(.96);}

  @media (max-width:360px){
    .name-col{font-size:17px;}
    .game-col{font-size:22px;}
  }
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setup">
  
  <h1 class="matchup"><span>LANGEL</span><span class="vs">VS</span><span>PANABERTH</span></h1>

  
  <div class="choice-row">
    <button class="choice active" data-format="3" onclick="selectFormat(3)">
      Mejor de 3<small>Gana el que llegue a 2 sets</small>
    </button>
    <button class="choice" data-format="5" onclick="selectFormat(5)">
      Mejor de 5<small>Gana el que llegue a 3 sets</small>
    </button>
  </div>

  <button class="start-btn" onclick="startMatch()">Comenzar partido</button>
  <button class="ghost-btn" style="width:100%;margin-top:12px;" onclick="openHistory()">Ver historial de partidos</button>

</div>

<!-- ============ MATCH SCREEN ============ -->
<div id="match">
  <div class="topbar">
    <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">EN JUEGO</span></span>
    <div class="topbar-right">
      <button class="history-link" onclick="openHistory()">Historial</button>
      <span class="timer num" id="timer">00:00</span>
    </div>
  </div>

  <div class="board">
    <div class="board-header">
      <div class="name-col"></div>
      <div id="setHeaderCols"></div>
      <div class="game-col">PTS</div>
    </div>
    <button class="row" id="row0" onclick="pointFor(0)">
      <span class="serve-dot" id="serve0"><img src="tennis_ball.png" alt=""></span>
      <span class="name-col">LANGEL</span>
      <span class="sets-wrap" id="sets0"></span>
      <span class="game-col" id="pts0"><span class="pill" id="pill0">0</span></span>
    </button>
    <button class="row" id="row1" onclick="pointFor(1)">
      <span class="serve-dot" id="serve1"><img src="tennis_ball.png" alt=""></span>
      <span class="name-col">PANABERTH</span>
      <span class="sets-wrap" id="sets1"></span>
      <span class="game-col" id="pts1"><span class="pill" id="pill1">0</span></span>
    </button>
  </div>
  <div class="hint">Toca el nombre del jugador que ganó el punto</div>

  <div class="controls">
    <button class="ghost-btn" onclick="undoPoint()">↺ Deshacer último punto</button>
    <button class="ghost-btn" onclick="confirmReset()">Reiniciar partido</button>
  </div>
</div>

<!-- ============ END OVERLAY ============ -->
<div id="endOverlay">
  <div class="end-card">
    <div class="trophy-line">PARTIDO FINALIZADO</div>
    <div class="winner-name" id="winnerName">—</div>
    <div class="final-score num" id="finalScoreLine"></div>
    <div class="final-meta" id="finalMeta"></div>
    <div class="end-actions">
      <button class="start-btn" onclick="downloadPdf(state)">Descargar PDF del partido</button>
      <button class="ghost-btn" onclick="openHistory()">Ver historial de partidos</button>
      <button class="ghost-btn" onclick="newMatch()">Nuevo partido</button>
    </div>
  </div>
</div>

<!-- ============ HISTORY OVERLAY ============ -->
<div id="historyOverlay">
  <div class="history-card">
    <div class="history-head">
      <span>Historial de partidos</span>
      <button class="close-btn" onclick="closeHistory()">✕</button>
    </div>
    <div id="historyList"></div>
    <button class="ghost-btn" style="width:100%;margin-top:14px;" onclick="clearHistory()">Borrar historial</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================
   MARCADOR DE TENIS — LANGEL vs PANABERTH
   Motor de reglas de tenis + PWA de una sola pantalla
   ========================================================= */

const NAMES = ["LANGEL", "PANABERTH"];
const STORAGE_KEY = "tennis_scoreboard_state_v1";
const HISTORY_KEY = "tennis_match_history_v1";

let state = null;
let chosenFormat = 3;
let timerInterval = null;

/* ---------- helpers ---------- */
const pointLabels = ["0", "15", "30", "40"];

function freshState(setsToWin, server){
  return {
    setsToWin,                 // 2 (bo3) or 3 (bo5)
    server,                    // 0 or 1 : who serves current game / next TB point
    points: [0,0],              // raw point counters for current game
    games: [0,0],                // games in current set
    setsWon: [0,0],
    setHistory: [],              // [{games:[a,b], tb:{loserPoints,type} | null}]
    tiebreak: null,              // {type:'reg'|'super', pts:[0,0], initialServer, pointsPlayed}
    matchOver: false,
    winner: null,
    startedAt: null,
    endedAt: null,
    pointLog: [],                // history for undo: snapshots
    historySaved: false           // guards against double-saving to match history on undo/redo
  };
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

/* ---------- match history (across matches, for the PDF archive) ---------- */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }catch(e){ return []; }
}
function saveHistory(arr){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }catch(e){}
}
function pushToHistory(record){
  const hist = loadHistory();
  hist.push({
    id: `${record.startedAt}_${record.endedAt}`,
    setsToWin: record.setsToWin,
    setHistory: record.setHistory,
    startedAt: record.startedAt,
    endedAt: record.endedAt,
    winner: record.winner
  });
  saveHistory(hist);
}

let historySorted = [];
function openHistory(){
  historySorted = loadHistory().slice().sort((a,b)=> new Date(b.startedAt) - new Date(a.startedAt));
  const list = document.getElementById('historyList');
  if(historySorted.length === 0){
    list.innerHTML = '<div class="history-empty">Todavía no hay partidos guardados. Cuando termines uno, aparecerá aquí.</div>';
  }else{
    list.innerHTML = historySorted.map((m,i)=>`
      <div class="history-item">
        <div class="history-item-main">
          <div class="history-winner">${NAMES[m.winner]} ganó</div>
          <div class="history-score num">${formatSetScoreLine(m)}</div>
          <div class="history-date">${fmtDateTime(m.startedAt)}</div>
        </div>
        <button class="pdf-btn" onclick="downloadPdf(historySorted[${i}])">PDF</button>
      </div>
    `).join('');
  }
  document.getElementById('historyOverlay').style.display = 'flex';
}
function closeHistory(){
  document.getElementById('historyOverlay').style.display = 'none';
}
function clearHistory(){
  if(confirm('¿Borrar todo el historial de partidos guardados? Esta acción no se puede deshacer.')){
    saveHistory([]);
    openHistory();
  }
}

/* ---------- setup screen ---------- */
function selectFormat(n){
  chosenFormat = n;
  document.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.choice[data-format="${n}"]`).classList.add('active');
}

function startMatch(){
  const setsToWin = chosenFormat === 5 ? 3 : 2;
  const server = Math.random() < 0.5 ? 0 : 1;
  state = freshState(setsToWin, server);
  state.startedAt = new Date().toISOString();
  save();
  document.getElementById('setup').style.display = 'none';
  document.getElementById('match').style.display = 'flex';
  renderSetHeader();
  render();
  startTimer();
}

function newMatch(){
  document.getElementById('endOverlay').style.display = 'none';
  document.getElementById('match').style.display = 'none';
  document.getElementById('setup').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
  state = null;
}

function confirmReset(){
  if(confirm("¿Reiniciar el partido actual? Se perderá el marcador.")){
    newMatch();
  }
}

/* ---------- rendering ---------- */
function renderSetHeader(){
  // number of set columns currently visible = completed sets + one in-progress (if match ongoing)
  const cols = state.setHistory.length + (state.matchOver ? 0 : 1);
  const el = document.getElementById('setHeaderCols');
  let html = '';
  for(let i=0;i<cols;i++){ html += `<div class="set-col">S${i+1}</div>`; }
  el.innerHTML = html;
}

function isFinalSet(){
  return state.setsWon[0] === state.setsToWin - 1 && state.setsWon[1] === state.setsToWin - 1;
}

function pointDisplay(p1, p2){
  if(p1 >= 3 && p2 >= 3){
    if(p1 === p2) return ["40","40","DEUCE"];
    if(p1 === p2 + 1) return ["AD","40"];
    if(p2 === p1 + 1) return ["40","AD"];
  }
  const d1 = p1 < 4 ? pointLabels[p1] : "40";
  const d2 = p2 < 4 ? pointLabels[p2] : "40";
  return [d1, d2];
}

function render(){
  if(!state) return;

  renderSetHeader();

  // status pill
  const pill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  if(state.matchOver){
    pill.classList.add('final');
    statusText.textContent = 'FINAL';
  }else{
    pill.classList.remove('final');
    statusText.textContent = state.tiebreak ? (state.tiebreak.type==='super' ? 'SUPER TIE BREAK' : 'TIE BREAK') : 'EN JUEGO';
  }

  // serve dots
  document.getElementById('serve0').classList.toggle('on', state.server === 0 && !state.matchOver);
  document.getElementById('serve1').classList.toggle('on', state.server === 1 && !state.matchOver);

  // set columns (completed sets + current in-progress)
  for(let p=0;p<2;p++){
    const container = document.getElementById('sets'+p);
    let html = '';
    state.setHistory.forEach(s=>{
      html += `<span class="set-col">${s.games[p]}</span>`;
    });
    if(!state.matchOver){
      html += `<span class="set-col current">${state.games[p]}</span>`;
    }
    container.innerHTML = html;
  }

  // points / tiebreak points
  if(state.tiebreak){
    document.getElementById('pill0').textContent = state.tiebreak.pts[0];
    document.getElementById('pill1').textContent = state.tiebreak.pts[1];
  }else if(!state.matchOver){
    const [d0,d1] = pointDisplay(state.points[0], state.points[1]);
    document.getElementById('pill0').textContent = d0;
    document.getElementById('pill1').textContent = d1;
  }else{
    document.getElementById('pill0').textContent = '';
    document.getElementById('pill1').textContent = '';
  }

  // leading row highlight (by sets, then games)
  const row0 = document.getElementById('row0');
  const row1 = document.getElementById('row1');
  row0.classList.remove('leading'); row1.classList.remove('leading');
  if(!state.matchOver){
    if(state.setsWon[0] > state.setsWon[1] || (state.setsWon[0]===state.setsWon[1] && state.games[0] > state.games[1])) row0.classList.add('leading');
    else if(state.setsWon[1] > state.setsWon[0] || (state.setsWon[0]===state.setsWon[1] && state.games[1] > state.games[0])) row1.classList.add('leading');
  }

  row0.disabled = state.matchOver;
  row1.disabled = state.matchOver;

  save();

  if(state.matchOver) showEndOverlay();
}

/* ---------- timer ---------- */
function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(!state || !state.startedAt) return;
    const end = state.endedAt ? new Date(state.endedAt) : new Date();
    const start = new Date(state.startedAt);
    const diff = Math.max(0, Math.floor((end - start)/1000));
    const h = String(Math.floor(diff/3600)).padStart(2,'0');
    const m = String(Math.floor((diff%3600)/60)).padStart(2,'0');
    const s = String(diff%60).padStart(2,'0');
    document.getElementById('timer').textContent = (h==='00'? `${m}:${s}` : `${h}:${m}:${s}`);
    if(state.matchOver) clearInterval(timerInterval);
  }, 1000);
}

/* ---------- tennis rules engine ---------- */
function snapshot(){
  state.pointLog.push(JSON.parse(JSON.stringify({
    points: state.points, games: state.games, setsWon: state.setsWon,
    setHistory: state.setHistory, tiebreak: state.tiebreak, server: state.server,
    matchOver: state.matchOver, winner: state.winner, endedAt: state.endedAt,
    historySaved: state.historySaved
  })));
  if(state.pointLog.length > 300) state.pointLog.shift();
}

function undoPoint(){
  if(!state || state.pointLog.length === 0) return;
  const prev = state.pointLog.pop();
  state.points = prev.points;
  state.games = prev.games;
  state.setsWon = prev.setsWon;
  state.setHistory = prev.setHistory;
  state.tiebreak = prev.tiebreak;
  state.server = prev.server;
  state.matchOver = prev.matchOver;
  state.winner = prev.winner;
  state.endedAt = prev.endedAt;
  state.historySaved = prev.historySaved;
  document.getElementById('endOverlay').style.display = 'none';
  renderSetHeader();
  render();
  if(!timerInterval) startTimer();
}

// server-within-tiebreak formula (see design notes): point k (1-indexed)
function tbServerForPoint(k, initial, other){
  if(k === 1) return initial;
  const group = Math.floor((k - 2) / 2);
  return group % 2 === 0 ? other : initial;
}

function pointFor(player){
  if(!state || state.matchOver) return;
  snapshot();
  const other = player === 0 ? 1 : 0;

  if(state.tiebreak){
    handleTiebreakPoint(player, other);
  }else{
    handleNormalPoint(player, other);
  }
  render();
}

function handleNormalPoint(player, other){
  state.points[player]++;
  const p = state.points[player], o = state.points[other];
  let gameWon = false;
  if(p >= 4 && p - o >= 2) gameWon = true;

  if(gameWon){
    state.games[player]++;
    state.points = [0,0];
    state.server = state.server === 0 ? 1 : 0; // alternate serve every game
    checkSetCompletionOrTiebreak(player);
  }
}

function checkSetCompletionOrTiebreak(lastGameWinner){
  const g = state.games;
  // set won outright
  if((g[0] >= 6 || g[1] >= 6) && Math.abs(g[0]-g[1]) >= 2){
    finishSet(g[0] > g[1] ? 0 : 1, null);
    return;
  }
  // 6-6 → tiebreak (regular, or super if this is the deciding final set)
  if(g[0] === 6 && g[1] === 6){
    const type = isFinalSet() ? 'super' : 'reg';
    state.tiebreak = { type, pts:[0,0], initialServer: state.server, pointsPlayed:0 };
  }
}

function handleTiebreakPoint(player, other){
  const tb = state.tiebreak;
  tb.pts[player]++;
  tb.pointsPlayed++;

  const target = tb.type === 'super' ? 10 : 7;
  const p = tb.pts[player], o = tb.pts[other];

  // update who serves NEXT point (for rendering the ball before the point after this one)
  const nextPointNumber = tb.pointsPlayed + 1;
  state.server = tbServerForPoint(nextPointNumber, tb.initialServer, tb.initialServer===0?1:0);

  if(p >= target && p - o >= 2){
    // tiebreak decides the set
    if(tb.type === 'super'){
      state.games[player] = Math.max(state.games[player], state.games[other]); // cosmetic, not used for display width
    } else {
      state.games[player] = 7; // displayed as 7-6
    }
    // Official rule: whoever RECEIVED the first point of the tiebreak serves first
    // in the next set. Equivalent to a single alternation from the tiebreak's
    // initial server (the tiebreak counts as one "game" in the serve rotation).
    const nextSetServer = tb.initialServer === 0 ? 1 : 0;
    finishSet(player, { type: tb.type, loserPoints: o, winnerPoints: p }, nextSetServer);
  }
}

function finishSet(winner, tbInfo, forcedNextServer){
  state.setHistory.push({ games: [...state.games], tb: tbInfo });
  state.setsWon[winner]++;
  state.games = [0,0];
  state.points = [0,0];
  state.tiebreak = null;
  if(typeof forcedNextServer === 'number') state.server = forcedNextServer;

  if(state.setsWon[winner] === state.setsToWin){
    state.matchOver = true;
    state.winner = winner;
    state.endedAt = new Date().toISOString();
    if(!state.historySaved){
      pushToHistory(state);
      state.historySaved = true;
    }
  }
}

/* ---------- end overlay ---------- */
function formatSetScoreLine(record){
  return record.setHistory.map(s=>{
    if(s.tb){
      const winnerGames = Math.max(s.games[0], s.games[1]);
      const loserGames = Math.min(s.games[0], s.games[1]);
      if(s.tb.type === 'super'){
        return `${s.tb.winnerPoints}-${s.tb.loserPoints}(STB)`;
      }
      return `${winnerGames}-${loserGames}(${s.tb.loserPoints})`;
    }
    return `${s.games[0]}-${s.games[1]}`;
  }).join('  ·  ');
}

function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('es-MX', { dateStyle:'medium', timeStyle:'short' });
}

function durationString(record){
  const start = new Date(record.startedAt);
  const end = new Date(record.endedAt);
  const diff = Math.max(0, Math.floor((end-start)/1000));
  const h = Math.floor(diff/3600), m = Math.floor((diff%3600)/60);
  return `${h}h ${m}m`;
}

function showEndOverlay(){
  document.getElementById('winnerName').textContent = `${NAMES[state.winner]} GANÓ`;
  document.getElementById('finalScoreLine').textContent = formatSetScoreLine(state);
  document.getElementById('finalMeta').innerHTML =
    `Inicio: ${fmtDateTime(state.startedAt)}<br>Fin: ${fmtDateTime(state.endedAt)}<br>Duración: ${durationString(state)}`;
  document.getElementById('endOverlay').style.display = 'flex';
}

/* ---------- PDF export ---------- */
function downloadPdf(record){
  record = record || state;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();

  doc.setFillColor(10,10,10);
  doc.rect(0,0,pageW,110,'F');
  doc.setTextColor(214,236,51);
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.text('Resultado del partido de tenis', 40, 50);
  doc.setTextColor(230,230,230);
  doc.setFontSize(13);
  doc.setFont('helvetica','normal');
  doc.text(`${NAMES[0]}  vs  ${NAMES[1]}`, 40, 75);

  let y = 145;
  doc.setTextColor(20,20,20);
  doc.setFontSize(15);
  doc.setFont('helvetica','bold');
  doc.text(`Ganador: ${NAMES[record.winner]}`, 40, y); y += 26;

  doc.setFont('helvetica','normal');
  doc.setFontSize(12);
  doc.text(`Formato: Mejor de ${record.setsToWin*2-1}`, 40, y); y += 20;
  doc.text(`Marcador por sets: ${formatSetScoreLine(record)}`, 40, y); y += 20;
  doc.text(`Fecha y hora de inicio: ${fmtDateTime(record.startedAt)}`, 40, y); y += 20;
  doc.text(`Fecha y hora de fin: ${fmtDateTime(record.endedAt)}`, 40, y); y += 20;
  doc.text(`Duración total: ${durationString(record)}`, 40, y); y += 30;

  doc.setDrawColor(220,220,220);
  doc.line(40, y, pageW-40, y); y += 24;

  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text('Detalle de sets', 40, y); y += 20;
  doc.setFont('helvetica','normal');
  doc.setFontSize(12);
  record.setHistory.forEach((s, i)=>{
    let line;
    if(s.tb){
      line = s.tb.type === 'super'
        ? `Set ${i+1} (decisivo): Super Tie Break ${s.tb.winnerPoints}-${s.tb.loserPoints}`
        : `Set ${i+1}: ${Math.max(s.games[0],s.games[1])}-${Math.min(s.games[0],s.games[1])} (tie break ${s.tb.winnerPoints}-${s.tb.loserPoints})`;
    } else {
      line = `Set ${i+1}: ${NAMES[0]} ${s.games[0]} - ${s.games[1]} ${NAMES[1]}`;
    }
    doc.text(line, 40, y); y += 18;
  });

  const dateTag = new Date(record.startedAt).toISOString().slice(0,10);
  doc.save(`partido_${NAMES[0]}_vs_${NAMES[1]}_${dateTag}.pdf`);
}

/* ---------- init: restore in-progress match if any ---------- */
(function init(){
  const restored = load();
  if(restored && restored.startedAt){
    state = restored;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('match').style.display = 'flex';
    renderSetHeader();
    render();
    startTimer();
    if(state.matchOver) showEndOverlay();
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
